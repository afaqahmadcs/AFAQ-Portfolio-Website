<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="codeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="jsYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7df1e"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#codeBg)"/>
  <circle cx="1020" cy="200" r="260" fill="#f7df1e" opacity="0.08" filter="blur(80px)"/>
  <circle cx="200" cy="580" r="220" fill="#3b82f6" opacity="0.08" filter="blur(70px)"/>

  <!-- Top Nav -->
  <rect width="1200" height="72" fill="#080c14" opacity="0.95"/>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="rgba(255,255,255,0.08)"/>

  <g transform="translate(60, 22)">
    <rect width="32" height="32" rx="6" fill="url(#jsYellow)"/>
    <text x="8" y="23" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900">JS</text>
    <text x="44" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">JavaScript <tspan fill="#f7df1e">Engineering Suite</tspan></text>
  </g>

  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
    <text x="760" y="42">ES6+ Modules</text>
    <text x="880" y="42">Async Patterns</text>
    <text x="990" y="42">Algorithms</text>
  </g>
  <rect x="1075" y="20" width="70" height="32" rx="4" fill="url(#jsYellow)"/>
  <text x="1110" y="41" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">GitHub</text>

  <!-- Title / Introduction -->
  <g transform="translate(60, 110)">
    <text x="0" y="24" fill="#f7df1e" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CORE JAVASCRIPT MASTERY &amp; PROBLEM SOLVING</text>
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Algorithms, Asynchronous I/O &amp; DOM Manipulation</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Production code drills covering Closures, Event Loop, Promises, Web APIs, and Functional Programming.</text>
  </g>

  <!-- Code Editor Window Mockup -->
  <g transform="translate(60, 230)">
    <rect width="1080" height="460" rx="12" fill="#030712" stroke="rgba(247,223,30,0.2)"/>
    
    <!-- Window Bar -->
    <rect width="1080" height="42" rx="12" fill="#0f172a"/>
    <rect y="30" width="1080" height="12" fill="#0f172a"/>
    <circle cx="20" cy="21" r="5" fill="#ef4444"/>
    <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="21" r="5" fill="#10b981"/>
    
    <!-- Tab -->
    <rect x="80" y="8" width="190" height="34" rx="6" fill="#030712"/>
    <text x="96" y="28" fill="#f7df1e" font-family="'JetBrains Mono', monospace" font-size="12">algorithms.es6.js</text>

    <!-- Code Lines -->
    <g transform="translate(30, 75)" font-family="'JetBrains Mono', monospace" font-size="13" line-height="24">
      <text x="0" y="20" fill="#6b7280">01</text>
      <text x="40" y="20" fill="#9333ea">const</text>
      <text x="90" y="20" fill="#60a5fa">memoizeAsync</text>
      <text x="200" y="20" fill="#ffffff">=</text>
      <text x="220" y="20" fill="#ffffff">(</text><text x="230" y="20" fill="#f472b6">fn</text><text x="250" y="20" fill="#ffffff">) =&gt; {</text>

      <text x="0" y="50" fill="#6b7280">02</text>
      <text x="60" y="50" fill="#9333ea">const</text>
      <text x="110" y="50" fill="#f59e0b">cache</text>
      <text x="160" y="50" fill="#ffffff">=</text>
      <text x="180" y="50" fill="#9333ea">new</text>
      <text x="215" y="50" fill="#34d399">Map</text><text x="245" y="50" fill="#ffffff">();</text>

      <text x="0" y="80" fill="#6b7280">03</text>
      <text x="60" y="80" fill="#9333ea">return async</text>
      <text x="175" y="80" fill="#ffffff">(</text><text x="185" y="80" fill="#f472b6">...args</text><text x="245" y="80" fill="#ffffff">) =&gt; {</text>

      <text x="0" y="110" fill="#6b7280">04</text>
      <text x="90" y="110" fill="#9333ea">const</text>
      <text x="140" y="110" fill="#ffffff">key = JSON.</text><text x="235" y="110" fill="#60a5fa">stringify</text><text x="315" y="110" fill="#ffffff">(args);</text>

      <text x="0" y="140" fill="#6b7280">05</text>
      <text x="90" y="140" fill="#9333ea">if</text>
      <text x="115" y="140" fill="#ffffff">(</text><text x="125" y="140" fill="#f59e0b">cache</text><text x="170" y="140" fill="#ffffff">.</text><text x="180" y="140" fill="#60a5fa">has</text><text x="210" y="140" fill="#ffffff">(key))</text>
      <text x="270" y="140" fill="#9333ea">return</text>
      <text x="330" y="140" fill="#f59e0b">cache</text><text x="375" y="140" fill="#ffffff">.</text><text x="385" y="140" fill="#60a5fa">get</text><text x="415" y="140" fill="#ffffff">(key);</text>

      <text x="0" y="170" fill="#6b7280">06</text>
      <text x="90" y="170" fill="#9333ea">const</text>
      <text x="140" y="170" fill="#ffffff">result =</text>
      <text x="215" y="170" fill="#9333ea">await</text>
      <text x="265" y="170" fill="#60a5fa">fn</text><text x="285" y="170" fill="#ffffff">(...args);</text>

      <text x="0" y="200" fill="#6b7280">07</text>
      <text x="90" y="200" fill="#f59e0b">cache</text><text x="135" y="200" fill="#ffffff">.</text><text x="145" y="200" fill="#60a5fa">set</text><text x="175" y="200" fill="#ffffff">(key, result);</text>

      <text x="0" y="230" fill="#6b7280">08</text>
      <text x="90" y="230" fill="#9333ea">return</text>
      <text x="150" y="230" fill="#ffffff">result;</text>

      <text x="0" y="260" fill="#6b7280">09</text>
      <text x="60" y="260" fill="#ffffff">};</text>

      <text x="0" y="290" fill="#6b7280">10</text>
      <text x="30" y="290" fill="#ffffff">};</text>
    </g>

    <!-- Test Suite Success Box -->
    <g transform="translate(620, 100)">
      <rect width="420" height="290" rx="8" fill="#0f172a" stroke="rgba(16,185,129,0.3)"/>
      <rect x="0" y="0" width="420" height="36" rx="8" fill="#1e293b"/>
      <rect x="0" y="28" width="420" height="8" fill="#1e293b"/>
      <text x="16" y="23" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">✓ Test Suite: PASS (14/14 tests)</text>
      
      <g transform="translate(16, 55)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">
        <text x="0" y="20" fill="#10b981">✓</text><text x="20" y="20">asynchronous memoization cache hits</text>
        <text x="0" y="45" fill="#10b981">✓</text><text x="20" y="45">event delegation bubbling verification</text>
        <text x="0" y="70" fill="#10b981">✓</text><text x="20" y="70">custom Promise.allSettled polyfill</text>
        <text x="0" y="95" fill="#10b981">✓</text><text x="20" y="95">deep clone handles cyclic references</text>
        <text x="0" y="120" fill="#10b981">✓</text><text x="20" y="120">debounce and throttle timing bounds</text>
        <text x="0" y="145" fill="#10b981">✓</text><text x="20" y="145">binary search &amp; graph traversal tests</text>
        
        <line x1="0" y1="165" x2="388" y2="165" stroke="rgba(255,255,255,0.08)"/>
        <text x="0" y="195" fill="#ffffff">Tests passed in 12ms · Zero Memory Leaks</text>
      </g>
    </g>
  </g>
</svg>
