<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="veloceBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="supercar" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#veloceBg)"/>

  <!-- Top Bar -->
  <rect width="1200" height="70" fill="#030408" opacity="0.95"/>
  <line x1="0" y1="70" x2="1200" y2="70" stroke="rgba(255,255,255,0.06)"/>

  <g transform="translate(60, 24)">
    <text x="0" y="18" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="3">VELOCE<tspan fill="#06b6d4">.</tspan></text>
  </g>

  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
    <text x="760" y="42">Showroom</text>
    <text x="860" y="42">Bespoke</text>
    <text x="940" y="42">Private Client</text>
  </g>
  <rect x="1050" y="20" width="90" height="32" rx="4" fill="none" stroke="url(#neonCyan)" stroke-width="1.5"/>
  <text x="1095" y="41" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Book VIP</text>

  <!-- Left Content -->
  <g transform="translate(60, 130)">
    <rect width="190" height="24" rx="4" fill="rgba(6,182,212,0.12)"/>
    <text x="95" y="16" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">AUTOMOTIVE EXCELLENCE</text>

    <text x="0" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800">High-Performance<br/>Electric Supercars</text>
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" max-width="500">
      Uniting electric propulsion, track-tuned aerodynamics, and bespoke handcrafted cockpits for the modern connoisseur.
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 220)">
      <rect width="110" height="34" rx="17" fill="url(#neonCyan)"/>
      <text x="55" y="21" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Hypercars</text>

      <rect x="120" width="130" height="34" rx="17" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
      <text x="185" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Grand Tourers</text>

      <rect x="260" width="120" height="34" rx="17" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
      <text x="320" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sport SUVs</text>
    </g>

    <!-- Metrics Card -->
    <g transform="translate(0, 290)">
      <rect width="440" height="90" rx="10" fill="#0f172a" stroke="rgba(6,182,212,0.2)"/>
      <text x="30" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">2.1s</text>
      <text x="30" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">0–60 MPH</text>

      <line x1="140" y1="20" x2="140" y2="70" stroke="rgba(255,255,255,0.1)"/>
      <text x="170" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">760 HP</text>
      <text x="170" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Dual Motors</text>

      <line x1="290" y1="20" x2="290" y2="70" stroke="rgba(255,255,255,0.1)"/>
      <text x="320" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">420 Mi</text>
      <text x="320" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Range (EPA)</text>
    </g>
  </g>

  <!-- Right Visual: Supercar Silhouette -->
  <g transform="translate(560, 130)">
    <rect width="580" height="540" rx="16" fill="#0b0f19" stroke="rgba(255,255,255,0.08)"/>
    
    <g transform="translate(30, 80)">
      <path d="M20 220 Q120 120 280 80 Q420 70 510 160 L540 220 Z" fill="url(#supercar)"/>
      <path d="M160 110 L280 85 L390 100 L460 145 Z" fill="#020617" opacity="0.85"/>
      <circle cx="110" cy="225" r="42" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="440" cy="225" r="42" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <line x1="0" y1="268" x2="540" y2="268" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Details overlay -->
    <g transform="translate(40, 390)">
      <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Veloce GT Electric Supercar</text>
      <text x="0" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">$195,000 Starting MSRP</text>
      
      <rect x="0" y="65" width="500" height="44" rx="8" fill="url(#neonCyan)"/>
      <text x="250" y="92" fill="#000000" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Reserve Custom Allocation</text>
    </g>
  </g>
</svg>
