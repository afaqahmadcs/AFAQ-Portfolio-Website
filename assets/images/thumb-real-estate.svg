<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#e6c98a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,.5)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Navbar -->
  <rect width="800" height="52" fill="rgba(15,23,42,0.95)"/>
  <rect x="28" y="18" width="80" height="16" rx="3" fill="#c9a96e" opacity=".9"/>
  <rect x="28" y="22" width="52" height="8" rx="2" fill="#c9a96e"/>
  <rect x="300" y="20" width="40" height="12" rx="2" fill="rgba(255,255,255,.15)"/>
  <rect x="355" y="20" width="60" height="12" rx="2" fill="rgba(255,255,255,.15)"/>
  <rect x="430" y="20" width="50" height="12" rx="2" fill="rgba(255,255,255,.15)"/>
  <rect x="495" y="20" width="55" height="12" rx="2" fill="rgba(255,255,255,.15)"/>
  <rect x="694" y="15" width="80" height="22" rx="11" fill="#c9a96e"/>
  <rect x="700" y="20" width="68" height="12" rx="6" fill="#c9a96e" opacity=".6"/>

  <!-- Hero Section -->
  <rect x="0" y="52" width="800" height="220" fill="url(#sky)"/>
  <!-- Hero background building silhouette -->
  <rect x="0" y="140" width="800" height="132" fill="rgba(0,0,0,.3)"/>
  <rect x="120" y="100" width="60" height="172" fill="rgba(255,255,255,.04)"/>
  <rect x="200" y="80" width="80" height="192" fill="rgba(255,255,255,.05)"/>
  <rect x="500" y="90" width="100" height="182" fill="rgba(255,255,255,.04)"/>
  <rect x="620" y="70" width="70" height="202" fill="rgba(255,255,255,.05)"/>
  <!-- Windows on buildings -->
  <rect x="128" y="110" width="10" height="10" rx="1" fill="rgba(255,255,230,.25)"/>
  <rect x="144" y="110" width="10" height="10" rx="1" fill="rgba(255,255,230,.15)"/>
  <rect x="128" y="126" width="10" height="10" rx="1" fill="rgba(255,255,230,.20)"/>
  <rect x="144" y="126" width="10" height="10" rx="1" fill="rgba(255,255,230,.30)"/>
  <rect x="210" y="92" width="12" height="10" rx="1" fill="rgba(255,255,230,.25)"/>
  <rect x="228" y="92" width="12" height="10" rx="1" fill="rgba(255,255,230,.15)"/>
  <rect x="246" y="92" width="12" height="10" rx="1" fill="rgba(255,255,230,.20)"/>
  <rect x="510" y="102" width="14" height="10" rx="1" fill="rgba(255,255,230,.20)"/>
  <rect x="530" y="102" width="14" height="10" rx="1" fill="rgba(255,255,230,.25)"/>
  <rect x="550" y="102" width="14" height="10" rx="1" fill="rgba(255,255,230,.15)"/>
  <!-- Hero text -->
  <rect x="160" y="82" width="260" height="22" rx="3" fill="rgba(255,255,255,.85)"/>
  <rect x="160" y="112" width="200" height="14" rx="3" fill="rgba(255,255,255,.45)"/>
  <rect x="160" y="132" width="170" height="14" rx="3" fill="rgba(255,255,255,.35)"/>
  <!-- Gold accent line -->
  <rect x="160" y="78" width="40" height="3" rx="1" fill="#c9a96e"/>
  <!-- Hero CTA -->
  <rect x="160" y="155" width="110" height="32" rx="6" fill="#c9a96e"/>
  <rect x="282" y="155" width="110" height="32" rx="6" fill="transparent" stroke="#c9a96e" stroke-width="1.5"/>

  <!-- Search bar -->
  <rect x="80" y="240" width="640" height="52" rx="8" fill="rgba(255,255,255,.96)" filter="url(#shadow)"/>
  <rect x="100" y="256" width="120" height="20" rx="4" fill="#e2e8f0"/>
  <rect x="242" y="256" width="1" height="20" fill="#e2e8f0"/>
  <rect x="262" y="256" width="100" height="20" rx="4" fill="#e2e8f0"/>
  <rect x="384" y="256" width="1" height="20" fill="#e2e8f0"/>
  <rect x="404" y="256" width="80" height="20" rx="4" fill="#e2e8f0"/>
  <rect x="620" y="248" width="80" height="36" rx="6" fill="#c9a96e"/>

  <!-- Property Cards row -->
  <!-- Card 1 -->
  <rect x="28" y="312" width="230" height="160" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="28" y="312" width="230" height="90" rx="10" fill="#2d4a7a"/>
  <rect x="28" y="362" width="230" height="40" rx="0" fill="#2d4a7a"/>
  <!-- building on card -->
  <rect x="60" y="325" width="166" height="77" fill="rgba(0,0,0,.2)"/>
  <rect x="80" y="330" width="30" height="72" fill="rgba(255,255,255,.08)"/>
  <rect x="118" y="320" width="40" height="82" fill="rgba(255,255,255,.10)"/>
  <rect x="166" y="335" width="35" height="67" fill="rgba(255,255,255,.07)"/>
  <rect x="28" y="380" width="230" height="92" rx="0" fill="#1e293b"/>
  <rect x="40" y="390" width="80" height="10" rx="2" fill="rgba(255,255,255,.8)"/>
  <rect x="40" y="406" width="110" height="8" rx="2" fill="rgba(255,255,255,.35)"/>
  <rect x="40" y="420" width="60" height="8" rx="2" fill="#c9a96e" opacity=".8"/>
  <rect x="170" y="416" width="70" height="24" rx="5" fill="#c9a96e"/>

  <!-- Card 2 -->
  <rect x="285" y="312" width="230" height="160" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="285" y="312" width="230" height="90" rx="10" fill="#1a3a5c"/>
  <rect x="285" y="362" width="230" height="40" rx="0" fill="#1a3a5c"/>
  <rect x="295" y="320" width="210" height="82" fill="rgba(0,0,0,.15)"/>
  <rect x="310" y="328" width="45" height="74" fill="rgba(255,255,255,.09)"/>
  <rect x="362" y="318" width="55" height="84" fill="rgba(255,255,255,.11)"/>
  <rect x="425" y="332" width="40" height="70" fill="rgba(255,255,255,.07)"/>
  <rect x="285" y="380" width="230" height="92" rx="0" fill="#1e293b"/>
  <rect x="297" y="390" width="95" height="10" rx="2" fill="rgba(255,255,255,.8)"/>
  <rect x="297" y="406" width="120" height="8" rx="2" fill="rgba(255,255,255,.35)"/>
  <rect x="297" y="420" width="65" height="8" rx="2" fill="#c9a96e" opacity=".8"/>
  <rect x="427" y="416" width="70" height="24" rx="5" fill="#c9a96e"/>

  <!-- Card 3 -->
  <rect x="542" y="312" width="230" height="160" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="542" y="312" width="230" height="90" rx="10" fill="#243044"/>
  <rect x="542" y="362" width="230" height="40" rx="0" fill="#243044"/>
  <rect x="552" y="320" width="210" height="82" fill="rgba(0,0,0,.15)"/>
  <rect x="570" y="325" width="50" height="77" fill="rgba(255,255,255,.08)"/>
  <rect x="628" y="315" width="60" height="87" fill="rgba(255,255,255,.12)"/>
  <rect x="696" y="330" width="40" height="72" fill="rgba(255,255,255,.08)"/>
  <rect x="542" y="380" width="230" height="92" rx="0" fill="#1e293b"/>
  <rect x="554" y="390" width="85" height="10" rx="2" fill="rgba(255,255,255,.8)"/>
  <rect x="554" y="406" width="115" height="8" rx="2" fill="rgba(255,255,255,.35)"/>
  <rect x="554" y="420" width="70" height="8" rx="2" fill="#c9a96e" opacity=".8"/>
  <rect x="684" y="416" width="70" height="24" rx="5" fill="#c9a96e"/>

  <!-- Bottom bar -->
  <rect x="0" y="472" width="800" height="28" fill="rgba(0,0,0,.5)"/>
  <rect x="28" y="480" width="60" height="8" rx="2" fill="rgba(255,255,255,.3)"/>
  <rect x="700" y="480" width="72" height="8" rx="2" fill="rgba(255,255,255,.15)"/>
</svg>
