<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="nexoraBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#nexoraBg)"/>

  <!-- Aurora blur orb -->
  <circle cx="850" cy="220" r="280" fill="url(#aurora)" opacity="0.12" filter="blur(60px)"/>

  <!-- Top Bar -->
  <rect width="1200" height="70" fill="#060910" opacity="0.95"/>
  <line x1="0" y1="70" x2="1200" y2="70" stroke="rgba(255,255,255,0.08)"/>

  <g transform="translate(60, 24)">
    <rect width="22" height="22" rx="4" fill="url(#aurora)"/>
    <text x="32" y="18" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700">NEXORA<tspan fill="#818cf8">LABS</tspan></text>
  </g>

  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
    <text x="740" y="42">Services</text>
    <text x="830" y="42">Case Studies</text>
    <text x="940" y="42">Pricing</text>
  </g>
  <rect x="1040" y="20" width="100" height="32" rx="6" fill="url(#aurora)"/>
  <text x="1090" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Get Started</text>

  <!-- Left Content -->
  <g transform="translate(60, 130)">
    <rect width="210" height="26" rx="13" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
    <text x="105" y="17" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">DIGITAL PRODUCT STUDIO</text>

    <text x="0" y="70" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="800">Building Digital Products<br/>With Precision &amp; Code.</text>
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" max-width="500">
      Engineering custom web applications, SaaS interfaces, and cloud architectures designed for performance and reliability.
    </text>

    <!-- Services Grid -->
    <g transform="translate(0, 220)">
      <rect width="220" height="110" rx="10" fill="#131b2e" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="36" cy="36" r="14" fill="rgba(99,102,241,0.2)"/>
      <text x="30" y="40" fill="#818cf8" font-size="12" font-weight="bold">#</text>
      <text x="60" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Web Engineering</text>
      <text x="24" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">High-performance frontend systems built with vanilla code.</text>

      <rect x="240" width="220" height="110" rx="10" fill="#131b2e" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="276" cy="36" r="14" fill="rgba(6,182,212,0.2)"/>
      <text x="270" y="40" fill="#06b6d4" font-size="12" font-weight="bold">&lt;&gt;</text>
      <text x="300" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Cloud Architecture</text>
      <text x="264" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Scalable backend pipelines and RESTful microservices.</text>
    </g>
  </g>

  <!-- Right Visual: Terminal & Dashboard UI Mockup -->
  <g transform="translate(580, 130)">
    <rect width="560" height="540" rx="14" fill="#0e1526" stroke="rgba(255,255,255,0.1)"/>
    
    <!-- Window Header -->
    <rect width="560" height="42" rx="14" fill="#172036"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#eab308"/>
    <circle cx="56" cy="21" r="5" fill="#22c55e"/>
    <text x="280" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">nexora-system-core v2.4.1</text>
    <circle cx="520" cy="21" r="4" fill="#22c55e"/>

    <!-- Dashboard Content -->
    <g transform="translate(30, 70)">
      <rect width="500" height="70" rx="8" fill="#131c30" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">System Performance</text>
      <text x="20" y="52" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12">● All Microservices 100% Operational</text>
      <text x="360" y="42" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Latency: 24ms</text>

      <!-- Metrics -->
      <g transform="translate(0, 90)">
        <rect width="155" height="100" rx="8" fill="#131c30"/>
        <text x="16" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Uptime Rate</text>
        <text x="16" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">99.98%</text>

        <rect x="172" width="155" height="100" rx="8" fill="#131c30"/>
        <text x="188" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Daily Queries</text>
        <text x="188" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">2.4M</text>

        <rect x="345" width="155" height="100" rx="8" fill="#131c30"/>
        <text x="361" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">API Status</text>
        <text x="361" y="65" fill="#22c55e" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Healthy</text>
      </g>

      <!-- Terminal logs -->
      <g transform="translate(0, 210)">
        <rect width="500" height="170" rx="8" fill="#080c14" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="35" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="12">> Initializing API Gateway routing...</text>
        <text x="20" y="65" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="12">> [OK] Cloud endpoints verified across 3 regions</text>
        <text x="20" y="95" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">> Synchronizing data streams and websocket states...</text>
        <text x="20" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">> System ready for continuous incoming requests</text>
        <line x1="20" y1="140" x2="35" y2="140" stroke="#818cf8" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
