<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="carbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="60%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="carshine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <radialGradient id="headlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="400" cy="300" rx="350" ry="180" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Floor reflection line -->
  <rect x="0" y="350" width="800" height="1" fill="rgba(255,255,255,.06)"/>

  <!-- Navbar -->
  <rect width="800" height="54" fill="rgba(10,10,15,.95)"/>
  <rect x="0" y="53" width="800" height="1" fill="rgba(255,255,255,.06)"/>
  <!-- Logo text -->
  <text x="32" y="33" font-family="serif" font-size="15" fill="white" letter-spacing="3" opacity=".9">VELOCE</text>
  <rect x="32" y="37" width="56" height="1" fill="rgba(255,200,0,.6)"/>
  <!-- Nav links -->
  <rect x="290" y="22" width="36" height="10" rx="2" fill="rgba(255,255,255,.18)"/>
  <rect x="340" y="22" width="48" height="10" rx="2" fill="rgba(255,255,255,.12)"/>
  <rect x="404" y="22" width="42" height="10" rx="2" fill="rgba(255,255,255,.12)"/>
  <rect x="462" y="22" width="54" height="10" rx="2" fill="rgba(255,255,255,.12)"/>
  <rect x="530" y="22" width="38" height="10" rx="2" fill="rgba(255,255,255,.12)"/>
  <!-- CTA button -->
  <rect x="700" y="16" width="68" height="22" rx="11" fill="rgba(255,200,0,.15)" stroke="rgba(255,200,0,.4)" stroke-width="1"/>
  <rect x="712" y="22" width="44" height="10" rx="2" fill="rgba(255,200,0,.7)"/>

  <!-- Hero text left -->
  <rect x="52" y="90" width="22" height="3" rx="1" fill="rgba(255,200,0,.6)"/>
  <rect x="52" y="100" width="190" height="24" rx="3" fill="rgba(255,255,255,.88)"/>
  <rect x="52" y="132" width="155" height="20" rx="3" fill="rgba(255,255,255,.65)"/>
  <rect x="52" y="162" width="210" height="12" rx="2" fill="rgba(255,255,255,.22)"/>
  <rect x="52" y="180" width="185" height="12" rx="2" fill="rgba(255,255,255,.16)"/>
  <rect x="52" y="210" width="108" height="32" rx="16" fill="rgba(255,200,0,.9)"/>
  <rect x="172" y="210" width="108" height="32" rx="16" fill="transparent" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>

  <!-- Main car silhouette (luxury sedan, sleek) -->
  <!-- Car body -->
  <path d="M 140 300 Q 200 240 310 228 Q 380 222 460 230 Q 540 238 600 260 L 650 285 Q 670 295 668 310 L 660 325 L 140 325 Z" fill="url(#carbody)"/>
  <!-- Car roof -->
  <path d="M 270 228 Q 310 190 380 182 Q 440 176 490 186 Q 530 194 560 216 L 540 228 L 290 228 Z" fill="rgba(40,40,60,.9)"/>
  <!-- Windshield -->
  <path d="M 295 228 Q 320 196 375 186 Q 420 178 460 188 L 450 228 Z" fill="rgba(100,140,200,.25)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <!-- Rear window -->
  <path d="M 460 228 L 475 190 Q 510 185 545 202 L 542 228 Z" fill="rgba(100,140,200,.20)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
  <!-- Car shine -->
  <path d="M 280 228 Q 360 200 490 188 L 480 210 Q 380 218 310 228 Z" fill="url(#carshine)"/>
  <!-- Front bumper detail -->
  <rect x="140" y="305" width="100" height="20" rx="4" fill="rgba(255,255,255,.06)"/>
  <rect x="148" y="311" width="30" height="8" rx="2" fill="rgba(255,255,255,.12)"/>
  <!-- Headlight glow -->
  <ellipse cx="175" cy="290" rx="22" ry="10" fill="url(#headlight)" opacity=".7"/>
  <ellipse cx="175" cy="290" rx="12" ry="6" fill="#fff8e0" opacity=".5"/>
  <!-- Rear light -->
  <rect x="638" y="275" width="18" height="30" rx="3" fill="rgba(220,50,50,.5)"/>
  <rect x="642" y="279" width="10" height="22" rx="2" fill="rgba(255,80,80,.6)" filter="url(#glow2)"/>
  <!-- Wheels -->
  <circle cx="230" cy="325" r="36" fill="#0d0d18" stroke="rgba(255,255,255,.12)" stroke-width="2"/>
  <circle cx="230" cy="325" r="24" fill="#111120" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
  <circle cx="230" cy="325" r="10" fill="rgba(255,200,0,.3)" stroke="rgba(255,200,0,.5)" stroke-width="1"/>
  <!-- Wheel spokes -->
  <line x1="230" y1="301" x2="230" y2="349" stroke="rgba(255,255,255,.15)" stroke-width="1.5"/>
  <line x1="206" y1="325" x2="254" y2="325" stroke="rgba(255,255,255,.15)" stroke-width="1.5"/>
  <line x1="213" y1="308" x2="247" y2="342" stroke="rgba(255,255,255,.10)" stroke-width="1"/>
  <line x1="213" y1="342" x2="247" y2="308" stroke="rgba(255,255,255,.10)" stroke-width="1"/>

  <circle cx="570" cy="325" r="36" fill="#0d0d18" stroke="rgba(255,255,255,.12)" stroke-width="2"/>
  <circle cx="570" cy="325" r="24" fill="#111120" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
  <circle cx="570" cy="325" r="10" fill="rgba(255,200,0,.3)" stroke="rgba(255,200,0,.5)" stroke-width="1"/>
  <line x1="570" y1="301" x2="570" y2="349" stroke="rgba(255,255,255,.15)" stroke-width="1.5"/>
  <line x1="546" y1="325" x2="594" y2="325" stroke="rgba(255,255,255,.15)" stroke-width="1.5"/>
  <line x1="553" y1="308" x2="587" y2="342" stroke="rgba(255,255,255,.10)" stroke-width="1"/>
  <line x1="553" y1="342" x2="587" y2="308" stroke="rgba(255,255,255,.10)" stroke-width="1"/>

  <!-- Car reflection on floor -->
  <path d="M 140 326 Q 200 340 310 342 Q 460 345 600 342 L 660 330 L 650 340 Q 560 360 400 362 Q 260 362 150 345 Z" fill="rgba(60,60,100,.15)"/>

  <!-- Right side — car cards -->
  <rect x="596" y="80" width="172" height="100" rx="8" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <rect x="608" y="92" width="148" height="48" rx="5" fill="rgba(255,255,255,.06)"/>
  <!-- Mini car on card -->
  <path d="M 620 128 Q 640 112 672 108 Q 704 112 724 128 L 726 136 L 618 136 Z" fill="rgba(255,255,255,.15)"/>
  <circle cx="636" cy="136" r="7" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
  <circle cx="710" cy="136" r="7" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
  <rect x="608" y="148" width="80" height="9" rx="2" fill="rgba(255,255,255,.6)"/>
  <rect x="608" y="163" width="55" height="7" rx="2" fill="rgba(255,200,0,.5)"/>
  <rect x="672" y="158" width="68" height="22" rx="11" fill="rgba(255,200,0,.15)" stroke="rgba(255,200,0,.3)" stroke-width="1"/>

  <rect x="596" y="196" width="172" height="100" rx="8" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <rect x="608" y="208" width="148" height="48" rx="5" fill="rgba(255,255,255,.06)"/>
  <path d="M 618 244 Q 640 228 670 225 Q 700 228 730 244 L 730 252 L 618 252 Z" fill="rgba(255,255,255,.12)"/>
  <circle cx="635" cy="252" r="7" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
  <circle cx="713" cy="252" r="7" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
  <rect x="608" y="264" width="90" height="9" rx="2" fill="rgba(255,255,255,.6)"/>
  <rect x="608" y="279" width="55" height="7" rx="2" fill="rgba(255,200,0,.5)"/>
  <rect x="672" y="274" width="68" height="22" rx="11" fill="rgba(255,200,0,.15)" stroke="rgba(255,200,0,.3)" stroke-width="1"/>

  <!-- Stats bar bottom -->
  <rect x="0" y="400" width="800" height="70" fill="rgba(10,10,15,.95)"/>
  <rect x="0" y="400" width="800" height="1" fill="rgba(255,255,255,.07)"/>
  <rect x="52" y="416" width="60" height="10" rx="2" fill="rgba(255,255,255,.5)"/>
  <rect x="52" y="432" width="40" height="7" rx="2" fill="rgba(255,200,0,.5)"/>
  <rect x="52" y="442" width="80" height="6" rx="2" fill="rgba(255,255,255,.15)"/>
  <rect x="250" y="416" width="60" height="10" rx="2" fill="rgba(255,255,255,.5)"/>
  <rect x="250" y="432" width="40" height="7" rx="2" fill="rgba(255,200,0,.5)"/>
  <rect x="250" y="442" width="80" height="6" rx="2" fill="rgba(255,255,255,.15)"/>
  <rect x="448" y="416" width="60" height="10" rx="2" fill="rgba(255,255,255,.5)"/>
  <rect x="448" y="432" width="40" height="7" rx="2" fill="rgba(255,200,0,.5)"/>
  <rect x="448" y="442" width="80" height="6" rx="2" fill="rgba(255,255,255,.15)"/>
  <rect x="646" y="416" width="60" height="10" rx="2" fill="rgba(255,255,255,.5)"/>
  <rect x="646" y="432" width="40" height="7" rx="2" fill="rgba(255,200,0,.5)"/>
  <rect x="646" y="442" width="80" height="6" rx="2" fill="rgba(255,255,255,.15)"/>
</svg>
