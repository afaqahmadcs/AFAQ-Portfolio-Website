<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="sfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061214"/>
      <stop offset="50%" stop-color="#0a1d20"/>
      <stop offset="100%" stop-color="#040b0d"/>
    </linearGradient>
    <linearGradient id="emeraldAcc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#sfBg)"/>
  <circle cx="1020" cy="220" r="260" fill="#10b981" opacity="0.10" filter="blur(70px)"/>
  <circle cx="150" cy="600" r="240" fill="#14b8a6" opacity="0.08" filter="blur(80px)"/>

  <!-- Top Nav -->
  <rect width="1200" height="72" fill="#040c0e" opacity="0.95"/>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="rgba(255,255,255,0.08)"/>

  <g transform="translate(60, 22)">
    <rect width="32" height="32" rx="8" fill="url(#emeraldAcc)"/>
    <path d="M16 8 L24 13 L16 18 L8 13 Z M8 17 L16 22 L24 17" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700">Study<tspan fill="#10b981">Flow</tspan></text>
  </g>

  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
    <text x="760" y="42">Modules</text>
    <text x="845" y="42">Flashcards</text>
    <text x="940" y="42">Focus Timer</text>
  </g>
  <rect x="1050" y="20" width="95" height="32" rx="6" fill="url(#emeraldAcc)"/>
  <text x="1097" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Launch App</text>

  <!-- Hero Content -->
  <g transform="translate(60, 110)">
    <text x="0" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">AI-POWERED LEARNING PLATFORM</text>
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Smart Study Cycles &amp; Knowledge Retention</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Adaptive spaced repetition, Pomodoro focus timers, and interactive course management.</text>
  </g>

  <!-- Study Interface Cards -->
  <g transform="translate(60, 240)">
    <!-- Active Course Card -->
    <rect width="680" height="440" rx="12" fill="#0c1e22" stroke="rgba(255,255,255,0.06)"/>
    <text x="32" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Active Study Session · Data Structures &amp; Algorithms</text>
    
    <!-- Timer & Progress Bar -->
    <rect x="32" y="70" width="616" height="12" rx="6" fill="#16383e"/>
    <rect x="32" y="70" width="440" height="12" rx="6" fill="url(#emeraldAcc)"/>
    <text x="32" y="105" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">72% Goal Completed · 25m Focus Sprint</text>

    <!-- Quiz Question Mockup -->
    <rect x="32" y="130" width="616" height="270" rx="8" fill="#071518" stroke="rgba(255,255,255,0.06)"/>
    <text x="56" y="165" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Topic: Binary Search Trees &amp; Time Complexity</text>
    <text x="56" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">What is the average time complexity of searching a balanced BST?</text>
    
    <!-- Option A -->
    <rect x="56" y="220" width="270" height="48" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
    <text x="76" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">A. O(log n) · Verified Correct</text>

    <!-- Option B -->
    <rect x="345" y="220" width="270" height="48" rx="6" fill="#0d2428" stroke="rgba(255,255,255,0.06)"/>
    <text x="365" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">B. O(n)</text>

    <!-- Option C -->
    <rect x="56" y="285" width="270" height="48" rx="6" fill="#0d2428" stroke="rgba(255,255,255,0.06)"/>
    <text x="76" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">C. O(1)</text>

    <!-- Option D -->
    <rect x="345" y="285" width="270" height="48" rx="6" fill="#0d2428" stroke="rgba(255,255,255,0.06)"/>
    <text x="365" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">D. O(n log n)</text>

    <text x="56" y="375" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">Streak: 14 Days Active · Mastery Rating 98%</text>
  </g>

  <!-- Right Sidebar Metrics -->
  <g transform="translate(770, 240)">
    <rect width="370" height="440" rx="12" fill="#0c1e22" stroke="rgba(16,185,129,0.2)"/>
    <text x="28" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Weekly Performance</text>

    <g transform="translate(28, 75)">
      <rect width="145" height="90" rx="8" fill="#071518"/>
      <text x="18" y="36" fill="#10b981" font-family="system-ui, sans-serif" font-size="28" font-weight="800">42h</text>
      <text x="18" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Study Time</text>
    </g>

    <g transform="translate(195, 75)">
      <rect width="145" height="90" rx="8" fill="#071518"/>
      <text x="18" y="36" fill="#14b8a6" font-family="system-ui, sans-serif" font-size="28" font-weight="800">320</text>
      <text x="18" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cards Mastered</text>
    </g>

    <g transform="translate(28, 190)">
      <rect width="312" height="215" rx="8" fill="#071518"/>
      <text x="18" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">TypeScript Architecture</text>
      <text x="18" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Tailwind CSS, React State Hooks,</text>
      <text x="18" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Spaced Repetition SM-2 Algorithm,</text>
      <text x="18" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Client-Side IndexedDB Offline Cache.</text>

      <rect x="18" y="140" width="276" height="40" rx="6" fill="url(#emeraldAcc)"/>
      <text x="156" y="165" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Continue Next Session ↗</text>
    </g>
  </g>
</svg>
