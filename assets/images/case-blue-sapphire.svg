<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="sapphireBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="60%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d061"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
    <linearGradient id="gemGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#sapphireBg)"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <!-- Navigation Bar -->
  <rect x="0" y="0" width="1200" height="72" fill="#050811" opacity="0.95"/>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Logo -->
  <g transform="translate(60, 24)">
    <polygon points="12,0 24,12 18,24 6,24 0,12" fill="url(#goldAcc)"/>
    <text x="36" y="18" fill="#ffffff" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" letter-spacing="2">BLUE SAPPHIRE</text>
    <text x="178" y="18" fill="url(#goldAcc)" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" letter-spacing="2">GEM STONES</text>
  </g>

  <!-- Nav Links -->
  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
    <text x="740" y="42">Collections</text>
    <text x="840" y="42">Certification</text>
    <text x="940" y="42">About Mine</text>
  </g>
  <rect x="1040" y="22" width="100" height="32" rx="16" fill="url(#goldAcc)"/>
  <text x="1090" y="43" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Enquire</text>

  <!-- Hero Header -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="rgba(245, 208, 97, 0.12)" stroke="rgba(245, 208, 97, 0.3)"/>
    <text x="110" y="17" fill="url(#goldAcc)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">CURATED NATURAL GEMSTONES</text>
    
    <text x="0" y="70" fill="#ffffff" font-family="'Cinzel', Georgia, serif" font-size="38" font-weight="700">Exceptional Natural Sapphires</text>
    <text x="0" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" max-width="600">
      Directly sourced from Ceylon and Kashmir with certified provenance and gemological verification.
    </text>
  </g>

  <!-- 3 Showcase Gemstone Cards -->
  <!-- Card 1 -->
  <g transform="translate(60, 270)">
    <rect width="330" height="420" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)"/>
    <!-- Gem Display Window -->
    <rect x="16" y="16" width="298" height="210" rx="10" fill="#03060c"/>
    <g transform="translate(165, 120)">
      <polygon points="0,-60 50,-25 50,25 0,60 -50,25 -50,-25" fill="url(#gemGrad1)"/>
      <polygon points="0,-40 30,-15 30,15 0,40 -30,15 -30,-15" fill="#60a5fa" opacity="0.4"/>
      <line x1="-50" y1="-25" x2="50" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      <line x1="50" y1="-25" x2="-50" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    </g>
    <rect x="28" y="28" width="90" height="22" rx="4" fill="rgba(34, 197, 94, 0.15)"/>
    <text x="73" y="43" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CERTIFIED</text>
    
    <!-- Specs -->
    <text x="20" y="260" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Royal Blue Sapphire</text>
    <text x="20" y="282" fill="url(#goldAcc)" font-family="system-ui, sans-serif" font-size="13" font-weight="600">3.42 Carats · Cushion Cut</text>
    <text x="20" y="308" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Origin: Ceylon (Sri Lanka) · Unheated Natural</text>
    
    <!-- CTA Button -->
    <rect x="20" y="340" width="290" height="46" rx="8" fill="#25d366"/>
    <text x="165" y="368" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Enquire via WhatsApp ↗</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(435, 270)">
    <rect width="330" height="420" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="16" y="16" width="298" height="210" rx="10" fill="#03060c"/>
    <g transform="translate(165, 120)">
      <polygon points="0,-65 45,-30 45,30 0,65 -45,30 -45,-30" fill="#1e40af"/>
      <polygon points="0,-45 28,-18 28,18 0,45 -28,18 -28,-18" fill="#93c5fd" opacity="0.35"/>
    </g>
    <rect x="28" y="28" width="90" height="22" rx="4" fill="rgba(34, 197, 94, 0.15)"/>
    <text x="73" y="43" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CERTIFIED</text>
    
    <text x="20" y="260" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Cornflower Blue Sapphire</text>
    <text x="20" y="282" fill="url(#goldAcc)" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2.18 Carats · Oval Cut</text>
    <text x="20" y="308" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Origin: Kashmir · Classic Vivid Hue</text>
    
    <rect x="20" y="340" width="290" height="46" rx="8" fill="#25d366"/>
    <text x="165" y="368" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Enquire via WhatsApp ↗</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(810, 270)">
    <rect width="330" height="420" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="16" y="16" width="298" height="210" rx="10" fill="#03060c"/>
    <g transform="translate(165, 120)">
      <polygon points="0,-60 55,-10 35,50 -35,50 -55,-10" fill="#ea580c"/>
      <polygon points="0,-40 35,-5 20,35 -20,35 -35,-5" fill="#fdba74" opacity="0.45"/>
    </g>
    <rect x="28" y="28" width="80" height="22" rx="4" fill="rgba(234, 88, 12, 0.2)"/>
    <text x="68" y="43" fill="#fb923c" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">RARE GEM</text>
    
    <text x="20" y="260" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Padparadscha Sapphire</text>
    <text x="20" y="282" fill="url(#goldAcc)" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1.95 Carats · Pear Facet</text>
    <text x="20" y="308" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Origin: Ceylon · Salmon-Sunset Color</text>
    
    <rect x="20" y="340" width="290" height="46" rx="8" fill="#25d366"/>
    <text x="165" y="368" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Enquire via WhatsApp ↗</text>
  </g>
</svg>
