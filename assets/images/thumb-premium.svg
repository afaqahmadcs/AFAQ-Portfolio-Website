<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#09090f"/><stop offset="100%" stop-color="#0e0e18"/></linearGradient>
<linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f0f20"/><stop offset="100%" stop-color="#13131f"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c9a96e"/><stop offset="50%" stop-color="#e8d5a3"/><stop offset="100%" stop-color="#c9a96e"/></linearGradient>
<linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
<radialGradient id="glow1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".25"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c9a96e" stop-opacity=".20"/><stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,0,0,.6)"/></filter>
</defs>

<rect width="800" height="500" fill="url(#bg)"/>
<!-- Ambient glows -->
<ellipse cx="200" cy="200" rx="250" ry="200" fill="url(#glow1)" filter="url(#blur)"/>
<ellipse cx="650" cy="320" rx="220" ry="180" fill="url(#glow2)" filter="url(#blur)"/>
<!-- Grid pattern -->
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,.03)" stroke-width="1"/>
</pattern>
</defs>
<rect width="800" height="500" fill="url(#grid)"/>

<!-- Navbar -->
<rect width="800" height="54" fill="rgba(9,9,15,.95)"/>
<rect x="0" y="53" width="800" height="1" fill="rgba(255,255,255,.07)"/>
<!-- Logo -->
<rect x="28" y="16" width="36" height="22" rx="4" fill="rgba(201,169,110,.12)" stroke="rgba(201,169,110,.3)" stroke-width="1"/>
<rect x="34" y="20" width="24" height="14" rx="2" fill="rgba(201,169,110,.4)"/>
<rect x="76" y="22" width="60" height="10" rx="2" fill="rgba(255,255,255,.6)"/>
<!-- Nav links -->
<rect x="290" y="22" width="40" height="10" rx="2" fill="rgba(255,255,255,.2)"/>
<rect x="346" y="22" width="55" height="10" rx="2" fill="rgba(255,255,255,.12)"/>
<rect x="417" y="22" width="48" height="10" rx="2" fill="rgba(255,255,255,.12)"/>
<rect x="481" y="22" width="52" height="10" rx="2" fill="rgba(255,255,255,.12)"/>
<rect x="549" y="22" width="40" height="10" rx="2" fill="rgba(255,255,255,.12)"/>
<!-- CTA -->
<rect x="694" y="15" width="80" height="24" rx="12" fill="url(#gold)" opacity=".9"/>
<rect x="698" y="20" width="72" height="14" rx="7" fill="rgba(201,169,110,.4)"/>

<!-- Hero section -->
<rect x="0" y="54" width="800" height="226" fill="url(#heroBg)"/>

<!-- Hero left content -->
<!-- Tag -->
<rect x="52" y="78" width="110" height="20" rx="10" fill="rgba(99,102,241,.15)" stroke="rgba(99,102,241,.3)" stroke-width="1"/>
<rect x="60" y="84" width="94" height="8" rx="2" fill="rgba(99,102,241,.6)"/>
<!-- Main heading -->
<rect x="52" y="108" width="280" height="24" rx="3" fill="rgba(255,255,255,.85)"/>
<rect x="52" y="140" width="220" height="20" rx="3" fill="rgba(255,255,255,.55)"/>
<!-- Gold underline accent -->
<rect x="52" y="105" width="48" height="2" rx="1" fill="url(#gold)"/>
<!-- Subtext -->
<rect x="52" y="172" width="240" height="10" rx="2" fill="rgba(255,255,255,.2)"/>
<rect x="52" y="188" width="200" height="10" rx="2" fill="rgba(255,255,255,.14)"/>
<!-- Buttons -->
<rect x="52" y="212" width="120" height="34" rx="17" fill="url(#gold)"/>
<rect x="54" y="214" width="116" height="30" rx="15" fill="rgba(201,169,110,.3)"/>
<rect x="186" y="212" width="120" height="34" rx="17" fill="transparent" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
<rect x="192" y="222" width="108" height="14" rx="3" fill="rgba(255,255,255,.2)"/>

<!-- Hero right — abstract luxury visual -->
<!-- Centered circle with logo mark -->
<circle cx="620" cy="168" r="100" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
<circle cx="620" cy="168" r="75" fill="rgba(255,255,255,.025)" stroke="rgba(201,169,110,.12)" stroke-width="1"/>
<circle cx="620" cy="168" r="50" fill="rgba(99,102,241,.08)" stroke="rgba(99,102,241,.2)" stroke-width="1"/>
<!-- Inner geometric mark -->
<polygon points="620,128 648,158 636,198 604,198 592,158" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity=".7"/>
<circle cx="620" cy="168" r="18" fill="url(#purple)" opacity=".6"/>
<rect x="614" y="162" width="12" height="12" rx="2" fill="rgba(255,255,255,.8)"/>
<!-- Orbiting dots -->
<circle cx="620" cy="68" r="4" fill="#c9a96e" opacity=".6"/>
<circle cx="720" cy="168" r="4" fill="#6366f1" opacity=".6"/>
<circle cx="620" cy="268" r="3" fill="#c9a96e" opacity=".4"/>
<circle cx="520" cy="168" r="3" fill="#6366f1" opacity=".4"/>
<!-- Lines from center -->
<line x1="620" y1="118" x2="620" y2="68" stroke="rgba(201,169,110,.2)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="670" y1="168" x2="720" y2="168" stroke="rgba(99,102,241,.2)" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Services / Features row -->
<rect x="28" y="296" width="234" height="90" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.07)" stroke-width="1" filter="url(#shadow)"/>
<rect x="44" y="312" width="32" height="32" rx="8" fill="rgba(99,102,241,.15)" stroke="rgba(99,102,241,.25)" stroke-width="1"/>
<rect x="50" y="320" width="20" height="16" rx="3" fill="rgba(99,102,241,.5)"/>
<rect x="84" y="314" width="100" height="11" rx="3" fill="rgba(255,255,255,.7)"/>
<rect x="84" y="332" width="130" height="8" rx="2" fill="rgba(255,255,255,.2)"/>
<rect x="84" y="346" width="110" height="8" rx="2" fill="rgba(255,255,255,.14)"/>
<rect x="44" y="366" width="200" height="8" rx="2" fill="rgba(255,255,255,.07)"/>

<rect x="283" y="296" width="234" height="90" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.07)" stroke-width="1" filter="url(#shadow)"/>
<rect x="299" y="312" width="32" height="32" rx="8" fill="rgba(201,169,110,.12)" stroke="rgba(201,169,110,.22)" stroke-width="1"/>
<rect x="305" y="320" width="20" height="16" rx="3" fill="rgba(201,169,110,.5)"/>
<rect x="339" y="314" width="110" height="11" rx="3" fill="rgba(255,255,255,.7)"/>
<rect x="339" y="332" width="125" height="8" rx="2" fill="rgba(255,255,255,.2)"/>
<rect x="339" y="346" width="100" height="8" rx="2" fill="rgba(255,255,255,.14)"/>
<rect x="299" y="366" width="200" height="8" rx="2" fill="rgba(255,255,255,.07)"/>

<rect x="538" y="296" width="234" height="90" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.07)" stroke-width="1" filter="url(#shadow)"/>
<rect x="554" y="312" width="32" height="32" rx="8" fill="rgba(16,185,129,.12)" stroke="rgba(16,185,129,.22)" stroke-width="1"/>
<rect x="560" y="320" width="20" height="16" rx="3" fill="rgba(16,185,129,.5)"/>
<rect x="594" y="314" width="105" height="11" rx="3" fill="rgba(255,255,255,.7)"/>
<rect x="594" y="332" width="130" height="8" rx="2" fill="rgba(255,255,255,.2)"/>
<rect x="594" y="346" width="115" height="8" rx="2" fill="rgba(255,255,255,.14)"/>
<rect x="554" y="366" width="200" height="8" rx="2" fill="rgba(255,255,255,.07)"/>

<!-- Bottom testimonial / CTA strip -->
<rect x="28" y="402" width="744" height="80" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
<!-- Gold quote mark -->
<text x="50" y="438" font-family="serif" font-size="36" fill="rgba(201,169,110,.25)">"</text>
<rect x="80" y="418" width="340" height="10" rx="2" fill="rgba(255,255,255,.45)"/>
<rect x="80" y="434" width="280" height="8" rx="2" fill="rgba(255,255,255,.22)"/>
<rect x="80" y="450" width="120" height="8" rx="2" fill="rgba(201,169,110,.45)"/>
<!-- Avatar circles -->
<circle cx="620" cy="442" r="16" fill="rgba(99,102,241,.25)" stroke="rgba(99,102,241,.3)" stroke-width="1.5"/>
<circle cx="648" cy="442" r="16" fill="rgba(201,169,110,.2)" stroke="rgba(201,169,110,.3)" stroke-width="1.5"/>
<circle cx="676" cy="442" r="16" fill="rgba(16,185,129,.2)" stroke="rgba(16,185,129,.3)" stroke-width="1.5"/>
<rect x="700" y="434" width="60" height="16" rx="8" fill="url(#gold)" opacity=".8"/>
</svg>
