<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="reBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#reBg)"/>

  <!-- Top Navbar -->
  <rect width="1200" height="70" fill="#070a0f" opacity="0.95"/>
  <line x1="0" y1="70" x2="1200" y2="70" stroke="rgba(255,255,255,0.08)"/>
  
  <g transform="translate(60, 24)">
    <rect width="24" height="24" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="36" y="18" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="700" letter-spacing="2">AFAQ AHMAD</text>
    <text x="165" y="18" fill="url(#goldGrad)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="3">REAL ESTATE</text>
  </g>

  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
    <text x="760" y="42">Properties</text>
    <text x="860" y="42">Advisory</text>
    <text x="950" y="42">Private Client</text>
  </g>
  <rect x="1050" y="20" width="90" height="32" rx="4" fill="url(#goldGrad)"/>
  <text x="1095" y="41" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Inquire</text>

  <!-- Hero Content Area -->
  <g transform="translate(60, 110)">
    <text x="0" y="30" fill="url(#goldGrad)" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3">INTERNATIONAL LUXURY PROPERTY ADVISORY</text>
    <text x="0" y="80" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700">Exceptional Properties.<br/>Enduring Global Value.</text>
    <text x="0" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" max-width="500">
      Private brokerage and portfolio acquisition for high-net-worth individuals across Beverly Hills, London, and Dubai.
    </text>

    <!-- Search/Filter Bar Mockup -->
    <g transform="translate(0, 220)">
      <rect width="640" height="56" rx="8" fill="#161e2e" stroke="rgba(255,255,255,0.12)"/>
      <text x="24" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Location: Bel Air, CA</text>
      <line x1="190" y1="12" x2="190" y2="44" stroke="rgba(255,255,255,0.1)"/>
      <text x="210" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Type: Luxury Villa</text>
      <line x1="370" y1="12" x2="370" y2="44" stroke="rgba(255,255,255,0.1)"/>
      <text x="390" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Range: $4M - $12M</text>
      <rect x="530" y="8" width="96" height="40" rx="6" fill="url(#goldGrad)"/>
      <text x="578" y="33" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Search</text>
    </g>

    <!-- Quick Stats -->
    <g transform="translate(0, 310)" fill="#ffffff" font-family="system-ui, sans-serif">
      <text x="0" y="24" font-size="28" font-weight="700">$4.8M+</text>
      <text x="0" y="44" font-size="11" fill="#94a3b8">Featured Villa</text>

      <text x="140" y="24" font-size="28" font-weight="700">6 Beds</text>
      <text x="140" y="44" font-size="11" fill="#94a3b8">7.5 Baths</text>

      <text x="260" y="24" font-size="28" font-weight="700">8,400</text>
      <text x="260" y="44" font-size="11" fill="#94a3b8">Square Feet</text>
    </g>
  </g>

  <!-- Right Visual: Villa Architectural Mockup -->
  <g transform="translate(740, 110)">
    <rect width="400" height="560" rx="16" fill="url(#skyGrad)"/>
    <!-- Villa Silhouette -->
    <path d="M0 320 L120 280 L280 280 L400 340 L400 560 L0 560 Z" fill="#0f172a"/>
    <!-- Infinity Pool Accent -->
    <rect x="40" y="420" width="320" height="90" rx="6" fill="#0284c7" opacity="0.85"/>
    <rect x="50" y="430" width="300" height="2" fill="#ffffff" opacity="0.4"/>
    
    <!-- Property Card Overlay -->
    <g transform="translate(20, 470)">
      <rect width="360" height="70" rx="10" fill="#050811" opacity="0.9" stroke="rgba(255,255,255,0.15)"/>
      <text x="20" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Villa Bellisima · Bel Air</text>
      <text x="20" y="48" fill="url(#goldGrad)" font-family="system-ui, sans-serif" font-size="13" font-weight="600">$4,850,000 USD</text>
      <rect x="250" y="16" width="90" height="38" rx="6" fill="url(#goldGrad)"/>
      <text x="295" y="40" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">View Tour</text>
    </g>
  </g>
</svg>
