<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sapphire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="40%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Browser Frame Header -->
  <rect width="800" height="48" fill="#1e293b" opacity="0.8"/>
  <circle cx="24" cy="24" r="6" fill="#ef4444"/>
  <circle cx="44" cy="24" r="6" fill="#eab308"/>
  <circle cx="64" cy="24" r="6" fill="#22c55e"/>
  <rect x="110" y="12" width="580" height="24" rx="12" fill="#0f172a" opacity="0.8"/>
  <text x="400" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">bluesapphiregemstones.com</text>

  <!-- Hero Content Mockup -->
  <!-- Header Menu -->
  <rect x="40" y="80" width="120" height="18" rx="4" fill="#3b82f6" opacity="0.3"/>
  <rect x="620" y="80" width="140" height="18" rx="4" fill="#94a3b8" opacity="0.2"/>

  <!-- Left Side: Title & Subtitle -->
  <text x="60" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="bold">BLUE SAPPHIRE</text>
  <text x="60" y="240" fill="url(#gold)" font-family="system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="2">EXQUISITE COLLECTION</text>
  <rect x="60" y="270" width="320" height="8" rx="4" fill="#94a3b8" opacity="0.4"/>
  <rect x="60" y="290" width="280" height="8" rx="4" fill="#94a3b8" opacity="0.4"/>
  <rect x="60" y="310" width="220" height="8" rx="4" fill="#94a3b8" opacity="0.4"/>
  
  <rect x="60" y="350" width="130" height="38" rx="6" fill="url(#gold)"/>
  <rect x="205" y="350" width="130" height="38" rx="6" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Right Side: Sapphire Gemstone Illustration -->
  <g transform="translate(560, 260)" filter="url(#glow)">
    <!-- Gemstone outer glow -->
    <polygon points="0,-120 90,-60 90,60 0,120 -90,60 -90,-60" fill="url(#sapphire)" opacity="0.2" transform="scale(1.15)"/>
    
    <!-- Main Gemstone shape -->
    <polygon points="0,-120 90,-60 90,60 0,120 -90,60 -90,-60" fill="url(#sapphire)"/>
    
    <!-- Facet definitions (lines and transparent colors) -->
    <!-- Top triangle -->
    <polygon points="0,-120 0,-40 -50,-80" fill="rgba(255, 255, 255, 0.15)"/>
    <polygon points="0,-120 0,-40 50,-80" fill="rgba(255, 255, 255, 0.25)"/>
    
    <!-- Side triangles -->
    <polygon points="-90,-60 -50,-80 0,-40 -60,0" fill="rgba(0, 0, 0, 0.15)"/>
    <polygon points="90,-60 50,-80 0,-40 60,0" fill="rgba(255, 255, 255, 0.1)"/>
    
    <!-- Bottom triangles -->
    <polygon points="-90,60 -60,0 0,40 0,120" fill="rgba(0, 0, 0, 0.25)"/>
    <polygon points="90,60 60,0 0,40 0,120" fill="rgba(255, 255, 255, 0.05)"/>
    
    <polygon points="-90,-60 -90,60 -60,0" fill="rgba(0, 0, 0, 0.2)"/>
    <polygon points="90,-60 90,60 60,0" fill="rgba(255, 255, 255, 0.2)"/>
    
    <!-- Center diamond -->
    <polygon points="0,-40 60,0 0,40 -60,0" fill="url(#sapphire)"/>
    
    <!-- Shiny reflections -->
    <polygon points="-60,0 0,-40 0,40" fill="url(#shine)" opacity="0.6"/>
    
    <!-- Gemstone border highlight -->
    <polygon points="0,-120 90,-60 90,60 0,120 -90,60 -90,-60" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.8"/>
  </g>
</svg>
