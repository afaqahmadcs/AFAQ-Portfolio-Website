<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="restBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120c08"/>
      <stop offset="50%" stop-color="#1c120a"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#restBg)"/>
  <circle cx="1020" cy="220" r="280" fill="#f59e0b" opacity="0.12" filter="blur(80px)"/>
  <circle cx="200" cy="580" r="240" fill="#ef4444" opacity="0.08" filter="blur(70px)"/>

  <!-- Top Nav -->
  <rect width="1200" height="72" fill="#0c0704" opacity="0.95"/>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="rgba(255,255,255,0.08)"/>

  <g transform="translate(60, 22)">
    <circle cx="16" cy="16" r="14" fill="url(#amberGlow)"/>
    <path d="M12 21 C12 21 16 19 16 15 C16 13 14 12 14 10 C14 10 18 12 18 15 C18 19 14 21 12 21 Z" fill="#ffffff"/>
    <text x="44" y="22" fill="#ffffff" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" letter-spacing="1">EMBER &amp; <tspan fill="#f59e0b">GRAIN</tspan></text>
  </g>

  <g fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
    <text x="760" y="42">Artisanal Menu</text>
    <text x="880" y="42">Chef's Table</text>
    <text x="980" y="42">Cellar</text>
  </g>
  <rect x="1060" y="20" width="85" height="32" rx="4" fill="url(#amberGlow)"/>
  <text x="1102" y="41" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Book Table</text>

  <!-- Hero Content -->
  <g transform="translate(60, 110)">
    <text x="0" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">GOURMET CULINARY SHOWCASE</text>
    <text x="0" y="65" fill="#ffffff" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="800">Cinematic Dining &amp; Artisanal Flame Craft</text>
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Handcrafted prime burgers, open woodfire grilling, and bespoke online reservation system.</text>
  </g>

  <!-- Culinary Showcase Grid -->
  <g transform="translate(60, 240)">
    <!-- Featured Burger Card -->
    <rect width="480" height="440" rx="12" fill="#18110b" stroke="rgba(245,158,11,0.2)"/>
    
    <!-- Dish Image / Illustration Area -->
    <rect x="20" y="20" width="440" height="230" rx="8" fill="#241910"/>
    <circle cx="240" cy="135" r="85" fill="url(#amberGlow)" opacity="0.3"/>
    <ellipse cx="240" cy="145" rx="75" ry="30" fill="#78350f"/>
    <ellipse cx="240" cy="135" rx="70" ry="25" fill="#b45309"/>
    <ellipse cx="240" cy="120" rx="65" ry="22" fill="#d97706"/>
    <ellipse cx="240" cy="105" rx="60" ry="26" fill="#f59e0b"/>
    <text x="240" y="195" fill="#ffffff" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">THE WAGYU TRUFFLE RESERVE</text>

    <g transform="translate(24, 280)">
      <text x="0" y="20" fill="#ffffff" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700">Woodfire Smoked A5 Wagyu</text>
      <text x="0" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Black winter truffle aioli, aged cave cheddar, toasted brioche.</text>
      
      <line x1="0" y1="65" x2="432" y2="65" stroke="rgba(255,255,255,0.08)"/>

      <text x="0" y="100" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="22" font-weight="800">$28.00</text>
      <rect x="300" y="78" width="130" height="34" rx="4" fill="url(#amberGlow)"/>
      <text x="365" y="100" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Order for Dine-In</text>
    </g>
  </g>

  <!-- Right Side: Menu Items & Experience -->
  <g transform="translate(570, 240)">
    <rect width="570" height="440" rx="12" fill="#18110b" stroke="rgba(255,255,255,0.06)"/>
    <text x="32" y="45" fill="#ffffff" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700">Artisanal Craft &amp; Provenance</text>

    <!-- Menu item 1 -->
    <g transform="translate(32, 75)">
      <rect width="506" height="75" rx="8" fill="#241910"/>
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Oak-Smoked Brisket Smash</text>
      <text x="440" y="32" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">$22.00</text>
      <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Double smash patties, house sweet-heat pickles, ember sauce</text>
    </g>

    <!-- Menu item 2 -->
    <g transform="translate(32, 165)">
      <rect width="506" height="75" rx="8" fill="#241910"/>
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Truffle Parmesan Duck Fat Fries</text>
      <text x="440" y="32" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">$12.00</text>
      <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Hand-cut Kennebec potatoes, 24-month aged Parmigiano-Reggiano</text>
    </g>

    <!-- Specs -->
    <g transform="translate(32, 260)">
      <rect width="506" height="145" rx="8" fill="#0d0805"/>
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Frontend Engineering Architecture</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TypeScript, High-Performance CSS Grid, Web Audio Soundscapes,</text>
      <text x="20" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Seamless online booking modals, Mobile-first responsive layout,</text>
      <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Deployed with edge caching on Vercel.</text>
      <text x="20" y="125" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Verified Live: emberkitchen-omega.vercel.app ↗</text>
    </g>
  </g>
</svg>
